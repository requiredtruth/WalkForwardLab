[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walkforwardlab"
version = "0.1.0"
description = "Leakage-resistant walk-forward strategy measurement"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
walkforwardlab = "walkforwardlab.cli:main"

[tool.setuptools.package-data]
walkforwardlab = ["data/*.csv", "data/*.json"]
